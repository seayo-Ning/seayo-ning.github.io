<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A73E8"/>
      <stop offset="100%" stop-color="#0F4C92"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00897B"/>
      <stop offset="100%" stop-color="#00695C"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0F4C92" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="640" height="320" rx="12" fill="url(#bg1)" stroke="#DCE6F7" stroke-width="2"/>
  <text x="320" y="34" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#174EA6" text-anchor="middle">Deep Learning-Based Intelligent Fault Diagnosis Pipeline</text>

  <!-- Stage 1: Vibration Signal -->
  <g filter="url(#shadow)">
    <rect x="28" y="64" width="165" height="212" rx="10" fill="#FFFFFF" stroke="#D2E3FC" stroke-width="1.5"/>
    <rect x="28" y="64" width="165" height="34" rx="10" fill="#E8F0FE"/>
    <text x="110" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1A73E8" text-anchor="middle">1. Machinery Signals</text>
    <!-- Waveform -->
    <rect x="44" y="114" width="133" height="68" rx="6" fill="#F8FAFD" stroke="#E0E7F1"/>
    <polyline fill="none" stroke="#1A73E8" stroke-width="1.8" points="50,148 58,136 64,162 70,122 76,172 82,144 90,152 98,138 104,165 110,118 116,174 122,145 130,150 138,132 145,160 152,126 160,166 170,148"/>
    <text x="110" y="206" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#4A5568" text-anchor="middle">Bearings / Gearboxes</text>
    <text x="110" y="224" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#4A5568" text-anchor="middle">Multi-Sensor Vibration</text>
    <rect x="52" y="240" width="116" height="22" rx="4" fill="#EDF2F7"/>
    <text x="110" y="255" font-family="Consolas, monospace" font-size="10.5" fill="#2D3748" text-anchor="middle">Time / Freq Domain</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M199 170 L225 170" stroke="#1A73E8" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="224,165 233,170 224,175" fill="#1A73E8"/>

  <!-- Stage 2: Deep Representation Learning -->
  <g filter="url(#shadow)">
    <rect x="238" y="64" width="174" height="212" rx="10" fill="#FFFFFF" stroke="#D2E3FC" stroke-width="1.5"/>
    <rect x="238" y="64" width="174" height="34" rx="10" fill="url(#blueGrad)"/>
    <text x="325" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">2. Deep Feature Extractor</text>
    <!-- Neural blocks -->
    <rect x="258" y="114" width="134" height="32" rx="6" fill="#E8F0FE" stroke="#90CAF9"/>
    <text x="325" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#174EA6" text-anchor="middle">Multi-Scale Conv / Attention</text>
    <path d="M325 146 L325 158" stroke="#1A73E8" stroke-width="1.8"/>
    <rect x="258" y="158" width="134" height="32" rx="6" fill="#E8EAF6" stroke="#9FA8DA"/>
    <text x="325" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#283593" text-anchor="middle">Invariant Representation</text>
    <path d="M325 190 L325 202" stroke="#3949AB" stroke-width="1.8"/>
    <rect x="258" y="202" width="134" height="32" rx="6" fill="#E0F2F1" stroke="#80CBC4"/>
    <text x="325" y="222" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#00695C" text-anchor="middle">Semantic / Domain Align</text>
    <text x="325" y="258" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" fill="#5F6368" text-anchor="middle">Noise-Robust &amp; Generalizable</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M418 170 L444 170" stroke="#00897B" stroke-width="2.5" stroke-linecap="round"/>
  <polygon points="443,165 452,170 443,175" fill="#00897B"/>

  <!-- Stage 3: Health State & Diagnosis -->
  <g filter="url(#shadow)">
    <rect x="457" y="64" width="155" height="212" rx="10" fill="#FFFFFF" stroke="#B2DFDB" stroke-width="1.5"/>
    <rect x="457" y="64" width="155" height="34" rx="10" fill="url(#tealGrad)"/>
    <text x="534" y="86" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">3. Fault Diagnosis</text>
    <!-- Status pills -->
    <rect x="475" y="116" width="119" height="28" rx="6" fill="#E6F4EA"/>
    <circle cx="490" cy="130" r="5" fill="#1E8E3E"/>
    <text x="503" y="134" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#137333">Normal State</text>

    <rect x="475" y="154" width="119" height="28" rx="6" fill="#FEF7E0"/>
    <circle cx="490" cy="168" r="5" fill="#F9AB00"/>
    <text x="503" y="172" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#B06000">Inner / Outer Race</text>

    <rect x="475" y="192" width="119" height="28" rx="6" fill="#FCE8E6"/>
    <circle cx="490" cy="206" r="5" fill="#D93025"/>
    <text x="503" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#C5221F">Unseen / Compound</text>

    <text x="534" y="252" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600" fill="#00695C" text-anchor="middle">Intelligent PHM System</text>
  </g>
</svg>
